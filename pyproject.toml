[project]
name = "diagnosis-agent"
version = "0.1.0"
description = "A LangGraph-based fault diagnosis agent framework"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.5.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
